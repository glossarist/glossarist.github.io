# Lychee Link Checker Configuration
# For Documentation: https://github.com/lycheeverse/lychee

# Cache results to avoid re-checking same URLs
cache = true
max_cache_age = "1d"

# Check both source files and built site
include_verbatim = true

# File types to check
include = [
  "dist/**/*.html"
]

# Exclude patterns for URLs
exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  ".bundle",
  ".sass-cache",
  ".jekyll-cache",
  # iso.org blocks bot user agents with 403; links are valid in browsers
  "^https?://www\\.iso\\.org/",
  # Self-referential canonical URLs — always 404 on production until
  # the page is deployed. The local build is the source of truth for
  # internal links (covered by the content-references vitest suite).
  "^https?://www\\.glossarist\\.org/"
]
