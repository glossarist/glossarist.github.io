<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Partitive hyperedge — VIM measurement result decomposed into its parts</title>
  <desc id="desc">Comprehensive concept "measurement result" (VIM 2.9) at the top. Three partitive members drop from a shared horizontal backline (complete decomposition). Left tooth: single solid line = compulsory, exactly_one (measured quantity value, VIM 2.10). Middle tooth: single solid + single dashed = compulsory, at_least_one (measurement uncertainty components, VIM 2.26 — at least one of Type A / Type B). Right tooth: single dashed line = optional, exactly_one (measurement procedure, VIM 2.6 — sometimes referenced alongside the result). Per ISO 704:2022 §5.5.4.3 line notation.</desc>
  <style>
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 1.5; }
    .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #212529; }
    .small { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #6c757d; }
    .backline { stroke: #212529; stroke-width: 2; fill: none; }
    .tooth-solid { stroke: #212529; stroke-width: 1.5; fill: none; }
    .tooth-dashed { stroke: #212529; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  
    @media (prefers-color-scheme: dark) {
      .box, .genus-box { fill: #1a1a2e !important; stroke: #dee2e6 !important; }
      .label, .char-text { fill: #e9ecef !important; }
      .small, .char-label, .name { fill: #adb5bd !important; }
      .opt-name { fill: #ffc107 !important; }
      .backline, .solid, .tooth-solid, .dashed, .tooth-dashed,
      .delimit, .delimit-multi, .tooth-delimit { stroke: #e9ecef !important; }
      .crit { fill: #4dabf7 !important; }
      .char-connector { stroke: #495057 !important; }
      .backline-1 { stroke: #4dabf7 !important; }
      .backline-2 { stroke: #ff922b !important; }
      .tooth-1 { stroke: #4dabf7 !important; }
      .tooth-2 { stroke: #ff922b !important; }
    }
  </style>

  <!-- Comprehensive concept -->
  <rect x="270" y="20" width="180" height="42" rx="6" class="box"/>
  <text x="360" y="40" text-anchor="middle" class="label" font-weight="600">measurement result</text>
  <text x="360" y="55" text-anchor="middle" class="small">comprehensive · VIM 2.9</text>

  <!-- Backline (joined = complete decomposition) -->
  <line x1="120" y1="100" x2="600" y2="100" class="backline"/>
  <text x="60" y="104" class="small">complete</text>

  <!-- Tooth 1: single solid (compulsory, exactly_one) -->
  <line x1="180" y1="100" x2="180" y2="200" class="tooth-solid"/>
  <text x="180" y="160" text-anchor="middle" class="small">required · exactly_one</text>

  <!-- Tooth 2: solid + dashed pair (compulsory, at_least_one) -->
  <line x1="354" y1="100" x2="354" y2="200" class="tooth-solid"/>
  <line x1="366" y1="100" x2="366" y2="200" class="tooth-dashed"/>
  <text x="360" y="160" text-anchor="middle" class="small">required · at_least_one</text>

  <!-- Tooth 3: single dashed (optional, exactly_one) -->
  <line x1="540" y1="100" x2="540" y2="200" class="tooth-dashed"/>
  <text x="540" y="160" text-anchor="middle" class="small">optional · exactly_one</text>

  <!-- Partitive member boxes -->
  <rect x="100" y="220" width="160" height="40" rx="6" class="box"/>
  <text x="180" y="238" text-anchor="middle" class="label">measured quantity value</text>
  <text x="180" y="252" text-anchor="middle" class="small">VIM 2.10</text>

  <rect x="280" y="220" width="160" height="40" rx="6" class="box"/>
  <text x="360" y="238" text-anchor="middle" class="label">measurement uncertainty</text>
  <text x="360" y="252" text-anchor="middle" class="small">VIM 2.26 (Type A / Type B)</text>

  <rect x="460" y="220" width="160" height="40" rx="6" class="box"/>
  <text x="540" y="238" text-anchor="middle" class="label">measurement procedure</text>
  <text x="540" y="252" text-anchor="middle" class="small">VIM 2.6</text>

  <!-- Footer legend -->
  <text x="360" y="310" text-anchor="middle" class="small">ISO 704:2022 §5.5.4.3 — line notation: single solid = required + exactly_one,</text>
  <text x="360" y="326" text-anchor="middle" class="small">solid + dashed pair = required + at_least_one, single dashed = optional.</text>
  <text x="360" y="342" text-anchor="middle" class="small">All teeth share the comprehensive AND the criterion of subdivision (coordinate concepts per ISO 12620).</text>
</svg>
